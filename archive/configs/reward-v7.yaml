# Outcome-only reward for the pure profile (openspec change pure-v4-map-hazards-and-stall).
# Terms describe what happened, never how to play. "First" terms and caps are per run.
# Novelty pays once per (stage, room, cell) per run; stall_restart is paid once on a stall truncation.
# Reward v7 = reward v6 + stagnation cost (openspec change stagnation-cost-reward-v7). The frozen
# evaluation (reports/2026-10-24-pure-v4-frozen-eval.md) showed no checkpoint beating random play:
# the policies stalled more (53-74% vs 41%) and lost less health, so they learned to avoid damage
# instead of fighting. Changes against v6: each idle second of the stall watchdog past
# stagnation.grace_seconds costs stagnation.per_second (at most -7.0 for the entire episode with the 90 s stall limit);
# stall_restart -5 (was -10), so a full stall costs at most -12 (a death from full health
# costs -10 + 6 * -0.5 = -13); player_damage_half_heart -0.5 (was -1).
# Archived: archive/configs/reward-v4.yaml ... reward-v6.yaml.
reward_version: 7
status: pure_v4
outcome:
  enemy_hp_fraction_total: 5.0
  room_clear_first: 10.0
  room_first_visit: 3.0
  floor_first_entered: 10.0
  player_damage_half_heart: -0.5
  death: -10.0
  stall_restart: -5.0
  time_second: -0.005
pickups:
  coin: 0.05
  bomb: 0.1
  key: 0.1
  consumable_run_cap: 3.0
  collectible_new: 2.0
  heal_half_heart: 0.5
novelty:
  coefficient: 0.02
  cell_size: 40
stagnation:
  per_second: -0.1
  grace_seconds: 20
