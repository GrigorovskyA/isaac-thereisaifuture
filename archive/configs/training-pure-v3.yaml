# Pure self-learning profile (openspec change pure-v3-observation-and-control).
# Lineage pure-v3 replaces pure-v2: after 23k steps the pure-v2 policy was still ~96% of
# maximum entropy, its agent could not see its own attacks, bombs, stats or weapon, and it
# decided every 3 game updates and pressed bomb/item/card on 75% of decisions. pure-v2 is
# preserved and not resumed: its checkpoints are refused (different contract hash).
# Changes against pure-v2: observation schema 4, reward v4, action repeat 6 and the
# use-head prior. One lineage trained continuously from scratch. Only `contract` binds the
# lineage; `hyperparameters` may be tuned between sessions and are recorded per checkpoint.
config_version: 2
status: pure_v3
contract:
  algorithm: RecurrentPPO
  device: cpu
  seed: 1
  lstm_hidden_size: 256
  action_repeat_game_updates: 6
  observation_schema_version: 4
  action_schema_version: 2
  reward_version: 4
  # Initial P(no use press) of the use head, set at fresh model creation only.
  use_head_initial_none_probability: 0.85
hyperparameters:
  learning_rate: 0.0003
  # 0.99 until t243200: a ~20 s horizon at 0.2 s per decision weighted the stall
  # penalty 90 s ahead at about 1%. 0.995 gives ~40 s (15-hour report).
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  # 0.01 until t243200; lowered because the use head drifted from the P(none)=0.85
  # prior back toward uniform and entropy stayed at 3.6-3.9 of 4.6 (overnight report).
  ent_coef: 0.005
  n_steps: 512
  batch_size: 128
  n_epochs: 4
budget:
  # Per session; the forever supervisor runs sessions back to back.
  wall_time_minutes: 480
  disk_limit_mb: 20480
  max_consecutive_faults: 5
retention:
  keep_latest: 5
  keep_every: 200  # periodic checkpoints in addition to the newest five; ~52 MB each
watchdog:
  stall_seconds: 90
