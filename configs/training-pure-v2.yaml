# Pure self-learning profile (openspec change reward-v3-and-training-metrics).
# Lineage pure-v2 replaces pure-v1 after reward v3 (v1 paid most for idling); pure-v1
# is preserved and not resumed: its checkpoints are refused (different contract hash).
# One lineage trained continuously from scratch. Only `contract` binds the lineage;
# `hyperparameters` may be tuned between sessions and are recorded per checkpoint.
config_version: 2
status: pure_v2
contract:
  algorithm: RecurrentPPO
  device: cpu
  seed: 1
  lstm_hidden_size: 256
  action_repeat_game_updates: 3
  observation_schema_version: 3
  action_schema_version: 2
  reward_version: 3
hyperparameters:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  n_steps: 512
  batch_size: 128
  n_epochs: 4
budget:
  # Per session; the forever supervisor runs sessions back to back.
  wall_time_minutes: 480
  disk_limit_mb: 20480
  max_consecutive_faults: 5
retention:
  keep_latest: 5
  keep_every: 200  # about one kept checkpoint per 3 h at ~9 steps/s; ~52 MB each
watchdog:
  stall_seconds: 90
