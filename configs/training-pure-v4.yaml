# Pure self-learning profile (openspec change pure-v4-map-hazards-and-stall).
# Lineage pure-v4 replaces pure-v3: after 15 hours and 243k steps pure-v3 explored more but
# cleared almost no rooms. Stalling paid better than fighting (-5 vs death -10), the agent could
# not see the stall clock, obstacles had no type, and it had no minimap. pure-v3 is preserved
# (archive/configs/training-pure-v3.yaml) and not resumed: its checkpoints are refused
# (different contract hash and reward contract).
# Changes against pure-v3: observation schema 5 (obstacle classes, room shape, minimap,
# stall clock) and reward v5 (stall restart -10), then v6 (kill credit: a kill pays the remaining
# enemy HP credit; a one-shot kill paid nothing). One lineage trained continuously from
# scratch. Reward v7 (stagnation cost, stall restart -5, hit -0.5; openspec change
# stagnation-cost-reward-v7) restarts lineage pure-v4 from scratch because the frozen evaluation
# showed no advantage over random play; the reward v6 run is kept as runs/pure-v4-reward-v6.
# Reward v8 (stall limit 90 s -> 40 s, stagnation -0.25 per second after 12 s; openspec change
# short-stall-reward-v8) restarts lineage pure-v4 from scratch again: after 477k steps the v7
# policy was still at random level and 82% of all steps were spent in stalled episodes. The
# reward v7 run is kept as runs/pure-v4-reward-v7. Hyperparameters are unchanged.
# Reward v9 and observation schema 6 (openspec change dense-exploration-reward-v9) restart the
# lineage once more: after 580k steps under reward v8 kills and clears per 1000 steps had
# plateaued, 60-70% of episodes still stalled and floor 2 was never reached. v9 pays exploration
# and run goals more, adds potential-based door shaping, and the policy sees a map of the cells it
# visited in the room. The reward v8 run is kept as runs/pure-v4-reward-v8. Only ent_coef changes.
# Observation schema 7 (2026-10-29) replaces schema 6 after its one-hour native check: the
# visited-cell grid now counts 40 px tiles from the room corner (60, 140), 26 x 14 cells, so a
# 1x1 room is exactly 13 x 7; schema 6 cut every tile in half. The schema 6 hour is not resumed.
# Observation schema 8 (openspec change rich-room-observation-v8) restarts the lineage with reward
# v9 unchanged: after about 200k steps the agent left the start room but visited only 2.2 rooms
# per episode and never reached floor 2. The policy now sees door types, locks and what lies
# behind each door, grouped room types on the minimap, the trapdoor and other floor features,
# slot machines and beggars, and larger entity caps. The reward v9 schema 7 run is kept as
# runs/pure-v4-reward-v9-schema7; its checkpoints are refused (new contract hash).
# Policy shape change (openspec change paused-updates-and-input-projection): a shared
# Linear(obs, 512) + ReLU in front of the actor and critic LSTMs restarts the lineage (new
# contract hash). With observation 7522 one optimizer update took 55 s on CPU; the projection
# cuts it to about 7 s. n_steps 1024 and batch_size 256 give fewer, cheaper updates, and the
# game is paused while each update runs. The schema 8 reward v9 run is not resumed.
# Reward v10 (openspec change graph-door-reward-v10) restarts the lineage with observation
# schema 8 unchanged: after 105k steps 92% of the stalls were in a cleared room and 40% of those
# had no open door to an unvisited room, where the v9 door term was silent. The door potential
# now counts the rooms still to cross through the doors seen on the floor. The reward v9 schema 8
# run (b26db425, final t102400) is kept as runs/pure-v4-reward-v9-schema8; its checkpoints are
# refused (new contract hash).
# Reward v11 (openspec change door-entry-fix-reward-v11) restarts the lineage after about 61k
# steps of reward v10, kept as runs/pure-v4-reward-v10: 73% of the stalls were in a cleared room
# near an open door to an unvisited room, because entering a new room paid about -2 under v10.
# Blocked doors now cost 0 (`blocked_cost`). Its checkpoints are refused (new contract hash).
# Same restart: n_epochs 4 -> 10, batch_size 256 -> 128 and target_kl 0.03. A 64k-step run made only
# about 62 updates with approx_kl ~0.006 and clip_fraction ~0.04, and the policy stayed near
# random. That is about 5x more gradient steps per sample; an update takes about 25-35 s with the
# game paused. target_kl stops the epochs early if the policy moves too far.
# Observation schema 9 (openspec change item-identity-observation-v9) is launched together with
# reward v11 and restarts the lineage once, so the v11 run has not trained yet. Until now the
# policy saw a pedestal item as one number and could not tell items apart. It now sees an identity
# bucket, quality, type, max charges and transformation tags of every pedestal item and of the
# active item, plus how many held items carry each tag (ItemConfig facts only). The schema 8
# checkpoints are refused (new contract hash).
# Reward v12 (openspec change door-pull-and-short-stall-reward-v12) restarts the lineage with
# observation schema 9 unchanged: after 254k steps of reward v11 the agent left the start room
# (88.6%) but 64% of the episodes still stalled, floor 2 was never reached, and a death at one
# half heart was cheaper than a stall. Door shaping coefficient 4 (was 2), death -11, stall
# restart -4, stagnation -0.39 per second, and the stall limit 40 s -> 30 s, which is now part of
# the reward contract (`watchdog.stall_seconds` must equal it). The reward v11 schema 9 run is
# kept as runs/pure-v4-reward-v11-schema9; its checkpoints are refused (new contract hash).
# Full-batch structured learner (openspec change full-batch-structured-learner) restarts the
# lineage with reward v12 and observation schema 9 unchanged: rewards v9-v12 all plateaued at
# about 2 rooms per episode (7-12% of the episodes reached 3+ rooms, slope ~0 after 75k steps)
# although the returns ranked rooms correctly. Three learner faults: (1) sb3-contrib does not
# shuffle recurrent minibatches, so with batch 128 each minibatch was part of one episode, the
# per-minibatch advantage normalization erased the differences between episodes, BPTT stopped
# at 128 steps and target_kl ended the update after 2-3.5 of 10 epochs; (2) VecNormalize scaled
# binary and one-hot features, so a rare bit (new minimap cell, rare room class, item bucket)
# jumped to about +10 when first seen; (3) one Linear(11691, 512) gave every minimap cell and
# entity slot its own weights. Now batch_size equals n_steps, only continuous features are
# normalized (`observation_normalization: continuous_only`) and shared slot MLPs, minimap and
# visited-cell CNNs feed the LSTMs (`policy_features: structured_v1`). The reward v12 schema 9
# run (stopped at t173056) is kept as runs/pure-v4-reward-v12-schema9; its checkpoints are
# refused (new contract hash).
# Rollout advantages and GPU learner (openspec change rollout-advantage-and-gpu-learner) restarts
# the lineage with reward v12, observation schema 9 and the structured features unchanged. Rewards
# v9-v12 plateaued at about 2 rooms per episode; the full-batch fix above repaired the
# per-minibatch advantage normalization but left only 10 gradient steps per 1024-step rollout.
# Now the advantages are normalized once over the whole rollout (`advantage_normalization:
# rollout`), so batch_size 256 again gives 4 minibatches per epoch and up to 40 gradient steps per
# rollout, and target_kl judges the mean KL of an epoch, not a single minibatch. The learner runs
# on the RTX 4070 (`device: cuda`, CUDA torch wheel), which makes these and larger updates and
# later auxiliary losses affordable. The full-batch structured run is kept as
# runs/pure-v4-full-batch-structured; its checkpoints are refused (new contract hash).
# Auxiliary self-prediction (openspec change auxiliary-self-prediction) restarts the lineage with
# reward v12, observation schema 9, the structured features, rollout advantages, batch 256 and
# cuda unchanged. PPO uses each step about ten times and drops it, and the learner idles while the
# game plays. Now the shared features also learn, from a replay of the last 8 rollouts, to predict
# the projected features of the next observation (one-step SPR against an EMA target), the scaled
# reward and the terminal outcome of each step (`auxiliary: spr_reward_done_v1`). These predict the
# agent's own observations and rewards; no reward term, hint or observation changes. The phase
# runs after the PPO epochs while the game is paused; the replay starts empty after each resume.
# The rollout-advantage contract (5eb6f93a...) never trained natively; its checkpoints would be
# refused (new contract hash).
# E3B x count intrinsic bonus (openspec change e3b-count-intrinsic) restarts the lineage with
# everything above unchanged. After 141k steps the GPU auxiliary run (kept as
# runs/pure-v4-gpu-auxiliary) fought better (1.57 kills, 0.25 clears per episode at 125-140k, against
# 1.06-1.43 and 0.13-0.19 for reward v11/v12) but still plateaued at about 2 rooms per episode with
# 13% of the episodes reaching 3+ rooms: the learner fixes helped, exploration beyond room 2 did
# not. `intrinsic: e3b_count_v1` pays an episodic elliptical bonus over a 128-d inverse-dynamics
# embedding (stall clock and visited-cell grid excluded) times the cross-run count factor, as its
# own ledger column `col_e3b`; evaluation never pays it. The 0399c37d... checkpoints are refused.
# Only `contract` binds the lineage; `hyperparameters` may be tuned between sessions
# and are recorded per checkpoint.
config_version: 2
status: pure_v4
contract:
  algorithm: RecurrentPPO
  # Learner and rollout inference on the GPU; training refuses to start without CUDA (no fallback).
  device: cuda
  seed: 1
  lstm_hidden_size: 256
  # Features extractor output width in front of the LSTMs, shared by actor and critic.
  features_dim: 512
  # Shared per-slot MLPs with masked mean/max pooling, minimap and visited-cell CNNs, scalar MLP.
  policy_features: structured_v1
  # Binary and one-hot features pass through; only continuous features are normalized.
  observation_normalization: continuous_only
  # Advantages are normalized once over the whole rollout, never per minibatch.
  advantage_normalization: rollout
  # Latent next-state (one-step SPR), reward and termination prediction on the shared features.
  auxiliary: spr_reward_done_v1
  # Prioritized Level Replay over run seeds (openspec change prioritized-level-replay) is off:
  # `level_replay` is absent, which means `none` and keeps this hash. `plr_v1` is a new lineage,
  # needs the redeployed observer mod and disables achievements in replayed (seeded) runs.
  # E3B x cross-run count intrinsic bonus (openspec change e3b-count-intrinsic), column col_e3b.
  intrinsic: e3b_count_v1
  action_repeat_game_updates: 6
  observation_schema_version: 9
  action_schema_version: 2
  reward_version: 12
  # Initial P(no use press) of the use head, set at fresh model creation only.
  use_head_initial_none_probability: 0.85
hyperparameters:
  learning_rate: 0.0003
  # 0.998 (was 0.995): the -10 stall penalty 425 steps ahead weighed
  # 0.12 and the agent learned to avoid damage instead of fighting (stall share
  # 0.39 -> 0.81 over four hours); 0.998 gives 0.43.
  gamma: 0.998
  # 0.98 (was 0.95): advantages look about 45 steps ahead, not 20.
  gae_lambda: 0.98
  clip_range: 0.2
  # 0.005 again. The 0.01 trial (fb22b342-s1-t510976, about 70k steps) did not raise entropy
  # and did not help: stalls went 60% -> 70% and kills per 1000 steps 6.7 -> 5.4. Before that
  # 0.01 was too high for the fresh use head, which drifted from its prior toward uniform.
  ent_coef: 0.005
  # 1024 (was 512): fewer updates, about one per 4 minutes of play. n_epochs 10 (4 earlier): only
  # ~62 updates in a 64k-step run left the policy near random (approx_kl ~0.006, clip_fraction
  # ~0.04). batch_size 256 (1024 in the full-batch run, 128 before): with the advantages
  # normalized over the whole rollout (contract) a minibatch no longer needs to span the rollout,
  # so 4 minibatches per epoch give 4x the gradient steps of the full batch. With batch 128 and
  # per-minibatch normalization sb3-contrib cut the rollout into slices of one episode each and
  # target_kl stopped after 2-3.5 epochs; explained variance was 0.43 against 0.7-0.88 with
  # batch 256. target_kl 0.03 ends the epochs early when the mean KL of an epoch is over 1.5x.
  # Not in the contract hash.
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  target_kl: 0.03
  # Auxiliary phase after the PPO epochs: 64 Adam steps of 256 transitions sampled uniformly from
  # the last 8 rollouts (about 215 MB of raw observations, in memory only), step size aux_coef x
  # learning_rate, EMA target rate 0.99. aux_approx_kl in train.csv shows how far the phase moved
  # the policy on the current rollout; lower aux_coef if it rivals approx_kl. Not hashed.
  aux_coef: 1.0
  aux_steps: 64
  aux_batch: 256
  replay_rollouts: 8
  target_ema: 0.99
  # Level replay sampler, used only with contract `level_replay: plr_v1` (otherwise ignored and not
  # recorded): replay a bank seed on half of the New Runs, rank temperature 0.1, staleness mix
  # 0.1, at most 500 seeds in the bank. Not hashed.
  plr_replay_probability: 0.5
  plr_temperature: 0.1
  plr_staleness: 0.1
  plr_bank_size: 500
  # E3B bonus, used only with contract `intrinsic: e3b_count_v1` (otherwise ignored and not
  # recorded): r_int = e3b_beta x clip(b / std(b) x max(1 / sqrt(N), e3b_floor), 0, 1) with b the
  # episodic elliptical bonus of a 128-d inverse-dynamics embedding (ridge e3b_lambda) and N the
  # cross-run novelty count of the next cell. 64 Adam steps of 256 replayed pairs per update. Not
  # hashed; a different e3b_embed_dim cannot load the saved E3B state.
  e3b_beta: 0.05
  e3b_lambda: 0.1
  e3b_floor: 0.1
  e3b_embed_dim: 128
  e3b_idm_steps: 64
  e3b_idm_batch: 256
  e3b_idm_lr: 0.0003
live:
  # Press Esc around each optimizer update so the game does not run while the learner is busy.
  # Best effort: a failed pause is recorded and training goes on.
  pause_during_updates: true
budget:
  # Per session; the forever supervisor runs sessions back to back.
  wall_time_minutes: 480
  disk_limit_mb: 20480
  max_consecutive_faults: 5
retention:
  keep_latest: 5
  # Periodic checkpoints in addition to the newest five, ~65 MB each: every 100 rollouts
  # (102k steps) is about every 7 h, ~0.25 GB a day. The checkpoint before each hyperparameter
  # change is pinned in checkpoints/pinned.txt and never pruned.
  keep_every: 100
watchdog:
  stall_seconds: 30
