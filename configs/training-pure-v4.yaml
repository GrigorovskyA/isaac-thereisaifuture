# Pure self-learning profile (openspec change pure-v4-map-hazards-and-stall).
# Lineage pure-v4 replaces pure-v3: after 15 hours and 243k steps pure-v3 explored more but
# cleared almost no rooms. Stalling paid better than fighting (-5 vs death -10), the agent could
# not see the stall clock, obstacles had no type, and it had no minimap. pure-v3 is preserved
# (archive/configs/training-pure-v3.yaml) and not resumed: its checkpoints are refused
# (different contract hash and reward contract).
# Changes against pure-v3: observation schema 5 (obstacle classes, room shape, minimap,
# stall clock) and reward v5 (stall restart -10), then v6 (kill credit: a kill pays the remaining
# enemy HP credit; a one-shot kill paid nothing). One lineage trained continuously from
# scratch. Only `contract` binds the lineage; `hyperparameters` may be tuned between sessions
# and are recorded per checkpoint.
config_version: 2
status: pure_v4
contract:
  algorithm: RecurrentPPO
  device: cpu
  seed: 1
  lstm_hidden_size: 256
  action_repeat_game_updates: 6
  observation_schema_version: 5
  action_schema_version: 2
  reward_version: 6
  # Initial P(no use press) of the use head, set at fresh model creation only.
  use_head_initial_none_probability: 0.85
hyperparameters:
  learning_rate: 0.0003
  # 0.995 (was 0.99): a ~40 s horizon makes a penalty 90 s ahead count.
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  # 0.005 (was 0.01): the use head drifted from its prior back toward uniform.
  ent_coef: 0.005
  n_steps: 512
  batch_size: 128
  n_epochs: 4
budget:
  # Per session; the forever supervisor runs sessions back to back.
  wall_time_minutes: 480
  disk_limit_mb: 20480
  max_consecutive_faults: 5
retention:
  keep_latest: 5
  keep_every: 200  # periodic checkpoints in addition to the newest five; ~52 MB each
watchdog:
  stall_seconds: 90
